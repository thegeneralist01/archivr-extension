name: Verify extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: archivr-extension
    steps:
      - name: Check out extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: archivr-extension
          persist-credentials: false
      - name: Check out compatible shared frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thegeneralist01/archivr
          ref: 19718cee2247b6ed77321a3a2ae269abd3e72db0
          path: archivr
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Type check
        run: bun run typecheck
      - name: Unit and X browser regressions
        run: bun run test:all
      - name: UI and packaged-extension smoke
        run: bun run test:ui
      - name: Package extension
        run: bun run zip
      - name: Save build and controlled UI previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-build-and-previews
          path: |
            archivr-extension/artifacts/archivr-extension.zip
            archivr-extension/artifacts/ui/
          if-no-files-found: error
          retention-days: 7
